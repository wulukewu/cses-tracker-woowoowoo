[build]
  command = "npm run build"
  publish = "dist"

# Declared explicitly so the scheduled warmers in netlify/functions are picked up
# alongside the Nitro server bundle, which Nuxt emits separately into
# .netlify/functions-internal. Each warmer's schedule lives in its own file, next
# to the TTL it is paced against.
[functions]
  directory = "netlify/functions"
